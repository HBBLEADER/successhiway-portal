<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GreatLife Recruiting, Onboarding &amp; Training System</title>
<script>
  // Phones get the reading version (text re-wraps to fit the screen).
  // "Page view" in the reading version comes back here with ?view=pages.
  (function () {
    var q = new URLSearchParams(location.search);
    if (window.innerWidth <= 600 && q.get("view") !== "pages") {
      location.replace("manual-reader.html" + location.hash);
    }
  })();
</script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1a1a1a; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  /* Column layout: gold bar on top, viewer fills the rest of the screen.
     100dvh = the phone's visible height (address bar excluded); 100vh is the fallback. */
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  .topbar {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    background: #b08d57; color: #fff; padding: 10px 18px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .topbar strong { font-size: 0.95rem; }
  .topbar .short { display: none; }
  .topbar a {
    background: #fff; color: #b08d57; text-decoration: none;
    padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 0.9rem;
    white-space: nowrap; margin-left: 12px;
  }
  .frame-wrap { flex: 1 1 auto; min-height: 0; }
  iframe { width: 100%; height: 100%; border: none; display: block; }

  /* Phones: one short line so the manual gets the screen */
  @media (max-width: 600px) {
    .topbar { padding: 6px 12px; }
    .topbar .full { display: none; }
    .topbar .short { display: inline; }
    .topbar a.short { display: inline-flex; }
    .topbar a { margin-left: 8px; }
    .topbar a { padding: 6px 12px; font-size: 0.85rem; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <strong><span class="full">GreatLife Recruiting, Onboarding &amp; Training System</span><span class="short">GreatLife Training Manual</span></strong>
    <a class="short" href="manual-reader.html">Reading view</a>
    <a href="https://portal.successhiway.com" target="_blank" rel="noopener"><span class="full">Open the Portal</span><span class="short">Portal</span></a>
  </div>
  <div class="frame-wrap">
    <iframe
      src="/pdfjs/web/viewer.html?file=https%3A%2F%2Fzeslbujpjagrfnqipvji.supabase.co%2Fstorage%2Fv1%2Fobject%2Fpublic%2Ftraining-materials%2FGreatLife_Training_Manual_v4.pdf#page=1"
      title="GreatLife Recruiting, Onboarding and Training Manual">
    </iframe>
  </div>
  <script>
    // ?page=N opens the manual at that page. On phones the Contents panel
    // starts closed so the page itself is showing (the "Contents" button opens it).
    (function () {
      var page = parseInt(new URLSearchParams(location.search).get("page"), 10);
      var frame = document.querySelector(".frame-wrap iframe");
      var src = frame.getAttribute("src");
      if (page > 0) src = src.replace(/#page=\d+$/, "#page=" + page);
      if (window.innerWidth <= 840) src += "&pagemode=none";
      if (src !== frame.getAttribute("src")) frame.src = src;
    })();

    // If the phone restores this page from its back/forward cache, the viewer
    // inside has been shut down and looks frozen. Reload so it works again.
    window.addEventListener("pageshow", function (evt) {
      if (evt.persisted) window.location.reload();
    });
  </script>
</body>
</html>
