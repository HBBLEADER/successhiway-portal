<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GreatLife Training Manual — Reading View</title>
<!-- Built by tools/build_reader.py from the manual's Word file. Edit the
     template in tools/reader_template.html, not this file. -->
<style>
  :root {
    --bar: #b08d57;
    --brass: #b6862c;
    --navy: #16233d;
    --paper: #f6f4ef;
    --card: #ffffff;
    --ink: #23282f;
    --ink-dim: #5c6570;
    --line: #d8d2c2;
    --quote-bg: #fbf7ee;
    --reader-size: 18px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: var(--reader-size); line-height: 1.6;
    overflow-wrap: break-word;
  }

  /* Top bar: one line, always visible */
  .bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 8px;
    background: var(--bar); color: #fff; padding: 8px 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .bar .title { flex: 1 1 auto; font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar a, .bar button {
    flex: 0 0 auto; font: inherit; font-size: 14px; font-weight: 600; line-height: 1;
    background: #fff; color: #8a6a35; border: 0; border-radius: 6px;
    padding: 9px 11px; min-height: 36px; text-decoration: none; cursor: pointer;
    display: inline-flex; align-items: center;
  }
  .bar .size { padding: 9px 9px; min-width: 36px; justify-content: center; }

  main { max-width: 720px; margin: 0 auto; padding: 0 16px 64px; }

  /* Cover */
  .cover { text-align: center; padding: 20px 0 8px; }
  .cover img { width: 100%; height: auto; border-radius: 6px; }
  .cover p { margin: 0.4em 0; color: var(--ink-dim); }

  /* Contents */
  #contents { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 0; margin: 20px 0 8px; }
  #contents h2 { margin: 8px 16px 4px; font-size: 1.15em; color: var(--navy); }
  #contents ol { list-style: none; margin: 0; padding: 0; }
  #contents li a {
    display: block; padding: 11px 16px; border-top: 1px solid var(--line);
    color: var(--ink); text-decoration: none; line-height: 1.35;
  }
  #contents li a:active, #contents li a:hover { background: var(--quote-bg); }
  .toc-num { display: block; font-size: 0.72em; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--brass); }
  .toc-name { display: block; }

  /* Sections */
  .part { scroll-margin-top: 64px; padding-top: 8px; }
  #contents { scroll-margin-top: 64px; }
  .part h2 {
    font-family: "Roboto Slab", Georgia, serif; color: var(--navy);
    font-size: 1.35em; line-height: 1.25; margin: 28px 0 2px;
    padding-top: 18px; border-top: 3px solid var(--bar);
  }
  .sec-num { display: block; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 0.6em; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--brass); margin-bottom: 2px; }
  .to-contents { display: inline-block; font-size: 0.8em; color: var(--brass); text-decoration: none; padding: 6px 0 4px; }
  .part h1, .part h3, .part h4 { font-size: 1.08em; line-height: 1.3; color: var(--navy); margin: 1.3em 0 0.4em; }
  .part p { margin: 0 0 0.85em; }
  .part ul, .part ol { padding-left: 1.3em; margin: 0 0 0.9em; }
  .part li { margin-bottom: 0.35em; }
  .part em strong, .part strong em { color: #1f2b40; }
  .part blockquote { margin: 0 0 0.9em; padding: 10px 14px; background: var(--quote-bg); border-left: 4px solid var(--bar); border-radius: 0 6px 6px 0; }
  .part img { max-width: 100%; height: auto; display: block; margin: 12px auto; }
  .part a { color: #8a6a35; }

  /* Worksheets and other wide tables scroll sideways inside their own box */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 0 1em; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
  .table-wrap table { border-collapse: collapse; min-width: 100%; font-size: 0.85em; }
  .table-wrap th, .table-wrap td { border: 1px solid var(--line); padding: 7px 9px; vertical-align: top; min-width: 7em; }
  .table-wrap th { background: var(--paper); text-align: left; }
  .table-wrap p { margin: 0; }

  .foot { text-align: center; color: var(--ink-dim); font-size: 0.8em; margin-top: 40px; }

  @media (min-width: 700px) {
    .bar { padding: 10px 18px; }
    .bar .title { font-size: 16px; }
  }
  @media print { .bar, .to-contents { display: none; } }
</style>
</head>
<body>
  <header class="bar">
    <span class="title">GreatLife Training Manual</span>
    <button type="button" class="size" id="smaller" aria-label="Smaller text">A−</button>
    <button type="button" class="size" id="bigger" aria-label="Bigger text">A+</button>
    <a href="#contents">Contents</a>
    <a id="pageView" href="manual-preview.html?view=pages">Page view</a>
  </header>

  <main>
    <div class="cover">
{{COVER}}
    </div>

    <nav id="contents" aria-label="Contents">
      <h2>Contents</h2>
      <ol>
{{CONTENTS}}
      </ol>
    </nav>

{{SECTIONS}}

    <p class="foot"><a href="#contents">▲ Back to Contents</a></p>
  </main>

<script>
(function () {
  "use strict";
  // Text size: A− / A+, remembered on this phone when the browser allows it.
  var MIN = 15, MAX = 28, KEY = "glReaderSize";
  var root = document.documentElement;
  function setSize(px) {
    px = Math.max(MIN, Math.min(MAX, px));
    root.style.setProperty("--reader-size", px + "px");
    try { localStorage.setItem(KEY, String(px)); } catch (e) {}
  }
  var size = 18;
  try { size = parseInt(localStorage.getItem(KEY), 10) || 18; } catch (e) {}
  setSize(size);
  document.getElementById("smaller").addEventListener("click", function () { size = Math.max(MIN, size - 2); setSize(size); });
  document.getElementById("bigger").addEventListener("click", function () { size = Math.min(MAX, size + 2); setSize(size); });

  // "Page view" opens the PDF pages. Opened from the Training page's lesson
  // window (?pdf=...&page=...), it opens the viewer right there at that page.
  var q = new URLSearchParams(location.search);
  var link = document.getElementById("pageView");
  if (q.get("pdf")) {
    link.href = "/pdfjs/web/viewer.html?file=" + encodeURIComponent(q.get("pdf")) +
                "#page=" + encodeURIComponent(q.get("page") || "1") + "&pagemode=none";
  } else if (q.get("page")) {
    link.href = "manual-preview.html?view=pages&page=" + encodeURIComponent(q.get("page"));
  }

  // If the phone restores this page from its back/forward cache, reload it.
  window.addEventListener("pageshow", function (evt) { if (evt.persisted) location.reload(); });
})();
</script>
</body>
</html>
