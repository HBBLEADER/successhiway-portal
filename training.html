<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Training Modules — GreatLife Portal</title>
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="topbar">
  <div class="brand">GreatLife Portal<small>Recruiting &amp; Training System</small></div>
  <nav>
    <a href="dashboard.html">&larr; Dashboard</a>
    <button class="signout" onclick="signOut()">Sign Out</button>
  </nav>
</div>

<div class="page">
  <h1>Training Modules</h1>
  <p class="section-note">Work through these in order. Your sponsor can flag a lesson as a priority for your Real Goal.</p>

  <div id="msg-area"></div>

  <div class="card">
    <h2>Overall Progress</h2>
    <div id="overall-progress"></div>
  </div>

  <div id="module-list"></div>
</div>

<div id="pdf-modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:1000; align-items:center; justify-content:center;">
  <div style="background:#fff; width:95%; height:92%; max-width:1100px; border-radius:8px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 10px 40px rgba(0,0,0,0.4);">
    <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 16px; background:var(--brass, #b08d57); color:#fff;">
      <strong id="pdf-modal-title" style="font-size:0.95rem;">Training Lesson</strong>
      <button id="pdf-modal-close" style="background:none; border:none; color:#fff; font-size:1.4rem; line-height:1; cursor:pointer; padding:4px 8px;">&times;</button>
    </div>
    <iframe id="pdf-modal-frame" style="flex:1; border:none; width:100%; height:100%;" title="Training lesson PDF"></iframe>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script>
  let currentMember = null;

  function showMsg(text, type) {
    document.getElementById("msg-area").innerHTML = `<div class="msg ${type}">${text}</div>`;
  }

  (async () => {
    const session = await requireSession();
    if (!session) return;
    currentMember = await getOrCreateMemberRecord(session);
    if (!currentMember) return;
    await loadModules();
  })();

  async function loadModules() {
    const { data: modules, error: modErr } = await supabaseClient
      .from("training_modules")
      .select("*")
      .order("order_index", { ascending: true });
    if (modErr) { showMsg(modErr.message, "error"); return; }

    const { data: progress, error: progErr } = await supabaseClient
      .from("member_training_progress")
      .select("*")
      .eq("member_id", currentMember.member_id);
    if (progErr) { showMsg(progErr.message, "error"); return; }

    const progressByModule = {};
    progress.forEach((p) => (progressByModule[p.module_id] = p));

    if (!modules.length) {
      document.getElementById("module-list").innerHTML =
        `<div class="card"><p>No training modules are loaded yet. Once the training manual sections are seeded into the database, they'll appear here automatically.</p></div>`;
      document.getElementById("overall-progress").innerHTML = "";
      return;
    }

    const completedCount = modules.filter((m) => progressByModule[m.module_id]?.is_completed).length;
    const pct = Math.round((completedCount / modules.length) * 100);
    document.getElementById("overall-progress").innerHTML = `
      <div>${completedCount} of ${modules.length} lessons complete (${pct}%)</div>
      <div class="progress-bar"><div style="width:${pct}%"></div></div>
    `;

    const listEl = document.getElementById("module-list");
    listEl.innerHTML = "";

    modules.forEach((mod) => {
      const p = progressByModule[mod.module_id];
      const isDone = p?.is_completed || false;
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
          <div>
            <span class="tile-num" style="color:var(--brass);">${mod.section_number}</span>
            <h3 style="margin:2px 0 4px;">${mod.title}</h3>
            ${mod.contains_script ? '<p style="margin:0; font-size:0.82rem; color:var(--ink-dim);">Includes scripts</p>' : ""}
            ${p?.is_priority_for_goal ? `<p style="margin:6px 0 0; font-size:0.85rem; color:var(--brass);"><strong>Sponsor priority:</strong> ${p.priority_reason || "Flagged as relevant to your Real Goal."}</p>` : ""}
            ${mod.pdf_url ? `<p style="margin:8px 0 0;"><a href="#" class="open-lesson-link" data-pdf-url="${mod.pdf_url}" data-pdf-page="${mod.pdf_page_number || ""}" data-title="${mod.section_number} — ${mod.title}">Open lesson${mod.pdf_page_number ? " (p. " + mod.pdf_page_number + ")" : ""}</a></p>` : ""}
          </div>
          <label style="display:flex; align-items:center; gap:8px; white-space:nowrap; margin:0;">
            <input type="checkbox" data-module-id="${mod.module_id}" ${isDone ? "checked" : ""} style="width:18px; height:18px;" />
            <span style="font-size:0.85rem; font-weight:600;">Complete</span>
          </label>
        </div>
      `;
      listEl.appendChild(div);
    });

    listEl.querySelectorAll(".open-lesson-link").forEach((link) => {
      link.addEventListener("click", (e) => {
        e.preventDefault();
        openPdfModal(link.dataset.pdfUrl, link.dataset.pdfPage, link.dataset.title);
      });
    });

    listEl.querySelectorAll("input[type=checkbox]").forEach((box) => {
      box.addEventListener("change", async () => {
        const moduleId = box.dataset.moduleId;
        const isCompleted = box.checked;
        const { error } = await supabaseClient
          .from("member_training_progress")
          .upsert({
            member_id: currentMember.member_id,
            module_id: moduleId,
            is_completed: isCompleted,
            completed_date: isCompleted ? new Date().toISOString().slice(0, 10) : null,
            last_viewed_at: new Date().toISOString(),
          }, { onConflict: "member_id,module_id" });
        if (error) { showMsg(error.message, "error"); return; }
        await loadModules();
      });
    });
  }

  function openPdfModal(pdfUrl, pageNumber, title) {
    const overlay = document.getElementById("pdf-modal-overlay");
    const frame = document.getElementById("pdf-modal-frame");
    const titleEl = document.getElementById("pdf-modal-title");
    titleEl.textContent = title || "Training Lesson";

    // PDF.js hosted viewer — sidebar stays closed by default, opens straight
    // to the correct page, and gives every rep the same clean reading view
    // regardless of what their device would otherwise open the PDF with.
    let viewerUrl = "https://mozilla.github.io/pdf.js/web/viewer.html?file=" + encodeURIComponent(pdfUrl);
    if (pageNumber) {
      viewerUrl += "#page=" + encodeURIComponent(pageNumber);
    }
    frame.src = viewerUrl;
    overlay.style.display = "flex";
  }

  function closePdfModal() {
    const overlay = document.getElementById("pdf-modal-overlay");
    const frame = document.getElementById("pdf-modal-frame");
    overlay.style.display = "none";
    frame.src = "about:blank"; // stop playback/loading when closed
  }

  document.getElementById("pdf-modal-close").addEventListener("click", closePdfModal);
  document.getElementById("pdf-modal-overlay").addEventListener("click", (e) => {
    if (e.target.id === "pdf-modal-overlay") closePdfModal();
  });
</script>

</body>
</html>
